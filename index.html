<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thế Giới Tư Duy Của Bé</title>
    
    <!-- Tích hợp thư viện Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" async></script>
    
    <style>
        :root {
            --bg-color: #E0F2FE; --card-border: #38BDF8; --primary: #38BDF8;
            --primary-hover: #0284C7; --text-main: #1E293B;
            --bg-pattern: url('data:image/svg+xml;utf8,<svg width="40" height="40" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="15" fill="%23FFFFFF" fill-opacity="0.3"/></svg>');
        }

        body.theme-default { --bg-color: #BAE6FD; --primary: #0EA5E9; --primary-hover: #0284C7; --card-border: #38BDF8; }
        body.theme-candy { --bg-color: #FBCFE8; --primary: #EC4899; --primary-hover: #BE185D; --card-border: #F472B6; }
        body.theme-forest { --bg-color: #BBF7D0; --primary: #22C55E; --primary-hover: #15803D; --card-border: #4ADE80; }
        body.theme-space { --bg-color: #C7D2FE; --primary: #6366F1; --primary-hover: #4338CA; --card-border: #818CF8; }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Nunito', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
        
        body { background-color: var(--bg-color); background-image: var(--bg-pattern); display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; transition: background-color 0.5s; padding: 10px;}

        .hidden { display: none !important; }
        .text-center { text-align: center; }
        .title { font-size: 32px; font-weight: 900; color: #0284C7; margin-bottom: 20px; text-transform: uppercase; text-shadow: 2px 2px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white; letter-spacing: 1px;}
        
        .top-bar { position: absolute; top: 15px; left: 0; width: 100%; padding: 0 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; pointer-events: none;}
        .realtime-clock { background: white; padding: 8px 15px; border-radius: 20px; font-weight: 900; font-size: 14px; color: var(--primary-hover); box-shadow: 0 4px 0 #E2E8F0; border: 2px solid #E2E8F0; pointer-events: auto;}
        .btn-setting-icon { background: #1E293B; color: white; border: 3px solid white; border-radius: 50%; width: 50px; height: 50px; font-size: 22px; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 0 #0F172A; transition: 0.2s; display: flex; align-items: center; justify-content: center;}
        .btn-setting-icon:hover { transform: translateY(3px) scale(1.05); box-shadow: 0 1px 0 #0F172A; }

        .screen { background: rgba(255, 255, 255, 0.98); border-radius: 30px; padding: 20px; width: 100%; max-width: 600px; max-height: 88vh; overflow-y: auto; box-shadow: 0 15px 30px rgba(0,0,0,0.15); border: 5px solid var(--card-border); position: relative; margin-top: 40px;}
        
        .btn-back { position: relative; z-index: 10; background: #EF4444; color: white; border: none; padding: 12px 20px; border-radius: 15px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 #B91C1C; font-size: 16px; margin-bottom: 15px; transition: 0.1s; display: inline-block;}
        .btn-back:active { transform: translateY(6px); box-shadow: 0 0 0 #B91C1C; }

        .theme-selector { display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .theme-btn { width: 40px; height: 40px; border-radius: 50%; border: 4px solid white; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.1); transition: 0.2s;}
        .theme-btn:hover { transform: scale(1.1) translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.1); }

        .profiles-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; margin-bottom: 10px; }
        .profile-card { background: white; border: 4px solid var(--primary); border-radius: 25px; padding: 20px 10px; transition: 0.2s; text-align: center; position: relative; box-shadow: 0 8px 0 var(--primary);}
        .profile-card:hover { transform: translateY(-5px); background: #F0F9FF;}
        
        .avatar-upload-zone { position: relative; display: inline-block; cursor: pointer; margin-bottom: 10px; transition: 0.2s; padding: 5px;}
        .avatar-upload-zone:hover { transform: scale(1.05) rotate(-3deg); }
        .avatar-upload-zone::after { content: '📷'; position: absolute; bottom: 0; right: 0px; font-size: 20px; background: white; border-radius: 50%; padding: 4px; box-shadow: 0 3px 0 #CBD5E1; border: 2px solid #E2E8F0; z-index: 10;}
        
        .kid-info-zone { cursor: pointer; padding: 5px; border-radius: 10px; }
        .avatar-box { font-size: 60px; height: 80px; display: flex; align-items: center; justify-content: center; }
        .avatar-img { width: 85px; height: 85px; border-radius: 50%; object-fit: cover; border: 4px solid #F1F5F9; display: block; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.15); background: white;}
        
        .kid-name-tag { font-weight: 900; color: var(--text-main); font-size: 22px; margin-bottom: 2px;}
        .kid-age-tag { font-size: 14px; color: #0284C7; font-weight: 900;}
        .kid-dob-tag { font-size: 12px; color: #64748B; margin-bottom: 10px; font-weight: bold;}
        .kid-diamond-tag { background: #FFFBEB; color: #D97706; padding: 6px 15px; border-radius: 15px; font-weight: 900; font-size: 15px; display: inline-block; border: 2px solid #FCD34D; box-shadow: 0 4px 0 #F59E0B;}

        .dashboard-section { background: white; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 3px solid #E2E8F0; box-shadow: 0 6px 0 #F1F5F9;}
        .dashboard-section h3 { font-size: 18px; color: var(--primary-hover); margin-bottom: 15px; border-bottom: 3px dashed #E2E8F0; padding-bottom: 10px; font-weight: 900;}
        .form-group { margin-bottom: 15px; }
        .form-group label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 15px; color: #475569;}
        .form-input { width: 100%; padding: 12px; border: 3px solid #93C5FD; border-radius: 15px; outline: none; font-size: 16px; font-weight: bold; color: #1E293B;}
        .btn-action { background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 15px; font-weight: 900; font-size: 16px; cursor: pointer; transition: 0.1s; box-shadow: 0 6px 0 var(--primary-hover);}
        .btn-action:active { transform: translateY(6px); box-shadow: 0 0 0 var(--primary-hover); }
        .btn-edit { background: #F59E0B; color: white; border: none; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #D97706; margin-right: 5px;}
        .btn-edit:active { transform: translateY(4px); box-shadow: 0 0 0 #D97706; }
        .btn-eval { background: #10B981; color: white; border: none; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #059669;}
        .btn-eval:active { transform: translateY(4px); box-shadow: 0 0 0 #059669; }

        #screen-game { background: transparent; box-shadow: none; border: none; padding: 0; overflow: hidden; display: flex; flex-direction: column; gap: 15px; max-height: 90vh; margin-top: 20px;}
        .game-top-panel { background: white; border-radius: 25px; padding: 15px 20px; border: 5px solid var(--primary); box-shadow: 0 8px 0 var(--primary-hover); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;}
        .kid-info-header { display: flex; align-items: center; gap: 12px; }
        .level-tag { background: #FEF3C7; color: #D97706; padding: 6px 12px; border-radius: 12px; font-weight: 900; font-size: 14px; border: 3px solid #FCD34D; box-shadow: 0 4px 0 #F59E0B; text-align: center;}
        .game-bottom-panel { background: white; border-radius: 30px; padding: 25px; border: 5px solid #F59E0B; box-shadow: 0 10px 0 #D97706; display: flex; flex-direction: column; flex-grow: 1; overflow-y: auto;}
        
        .question-display { 
            background: #FFFBEB; border: 4px dashed var(--primary); border-radius: 25px; 
            padding: 15px 20px; font-weight: 900; color: var(--text-main); margin-bottom: 20px; 
            text-align: center; display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-height: 120px; font-size: clamp(18px, 4vw, 24px); line-height: 1.4; word-wrap: break-word; overflow-wrap: break-word;
        }
        .story-text { font-size: 1em; color: #334155; margin-bottom: 8px; font-weight: 900; }
        .emoji-big { font-size: 1.6em; margin: 5px 0; word-break: break-all; line-height: 1.2;}
        .inline-avatar { display: inline-flex; align-items: center; justify-content: center; width: 1.5em; height: 1.5em; vertical-align: bottom; margin: 0 5px; }
        .visual-target { font-size: 2.2em; margin: 10px 0; display: inline-block; word-break: break-all; line-height: 1.2;}

        .answers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-answer { background: white; border: 4px solid #E2E8F0; border-radius: 20px; padding: 15px; font-size: clamp(24px, 5vw, 36px); font-weight: 900; color: var(--text-main); cursor: pointer; transition: 0.1s; box-shadow: 0 8px 0 #E2E8F0; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.3;}
        .btn-answer:hover { background: #FEF3C7; border-color: #F59E0B; box-shadow: 0 8px 0 #D97706;}
        .btn-answer:active { transform: translateY(8px); box-shadow: 0 0 0 #D97706; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; z-index: 999999; backdrop-filter: blur(5px);}
        .modal-content { background: white; padding: 25px; border-radius: 30px; text-align: center; width: 90%; max-width: 380px; border: 6px solid var(--primary); box-shadow: 0 15px 0 var(--primary-hover); max-height: 90vh; overflow-y: auto; position: relative;}
        
        .btn-modal-exit { position: absolute; top: -10px; left: -10px; background: #EF4444; color: white; border: none; padding: 10px 15px; border-radius: 12px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #B91C1C; font-size: 14px; z-index: 1000000; transition: 0.1s;}
        .btn-modal-exit:active { transform: translateY(4px); box-shadow: 0 0 0 #B91C1C; }

        .pin-display-box { font-size: 40px; color: var(--text-main); font-weight: 900; background: #F1F5F9; border: 4px solid #CBD5E1; border-radius: 20px; padding: 10px; margin-bottom: 15px; min-height: 70px; display: flex; align-items: center; justify-content: center; letter-spacing: 5px; box-shadow: inset 0 4px 8px rgba(0,0,0,0.1); margin-top: 20px;}
        
        .virtual-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .key-btn { background: #E0F2FE; border: 3px solid #7DD3FC; border-radius: 15px; font-size: 24px; font-weight: 900; color: #0284C7; padding: 12px 0; cursor: pointer; box-shadow: 0 5px 0 #38BDF8; transition: 0.1s;}
        .key-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #38BDF8; }
        .key-btn-red { background: #FEE2E2; border-color: #FCA5A5; color: #DC2626; box-shadow: 0 5px 0 #F87171;}
        .key-btn-red:active { box-shadow: 0 0 0 #F87171; }
        .key-btn-green { background: #DCFCE7; border-color: #86EFAC; color: #16A34A; box-shadow: 0 5px 0 #4ADE80;}
        .key-btn-green:active { box-shadow: 0 0 0 #4ADE80; }

        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #10B981; color: white; padding: 15px 30px; border-radius: 30px; font-weight: 900; font-size: 16px; box-shadow: 0 8px 0 #059669; z-index: 9999999; opacity: 0; transition: 0.3s; pointer-events: none; border: 3px solid white;}
        .toast.show { opacity: 1; bottom: 50px; }

        @keyframes floatReward {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-5deg); }
            50% { transform: translate(-50%, -100%) scale(1.3) rotate(5deg); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1.5) rotate(0deg); }
        }
    </style>
</head>
<body>

    <input type="file" id="global-avatar-upload" hidden accept="image/*" onchange="handleGlobalAvatarUpload(event)">

    <div class="top-bar">
        <div class="realtime-clock" id="clock-display">Đang tải...</div>
        <button class="btn-setting-icon" onclick="showAuthModal('parent')" title="Quản Lý Ba Mẹ">⚙️</button>
    </div>

    <div id="screen-welcome" class="screen">
        <h1 class="title text-center">🌟 CHỌN BÉ CHƠI</h1>
        <div class="theme-selector">
            <div class="theme-btn" style="background: #BAE6FD;" onclick="changeTheme('default')"></div>
            <div class="theme-btn" style="background: #FBCFE8;" onclick="changeTheme('candy')"></div>
            <div class="theme-btn" style="background: #BBF7D0;" onclick="changeTheme('forest')"></div>
            <div class="theme-btn" style="background: #C7D2FE;" onclick="changeTheme('space')"></div>
        </div>
        <div id="profiles-container" class="profiles-grid"></div>
    </div>

    <div id="screen-parent" class="screen hidden">
        <button class="btn-back" onclick="switchScreen('screen-welcome')">⬅ Về Trang Chủ</button>
        <h1 class="title text-center" style="color: var(--primary-hover); text-shadow: none;">Khu Vực Phụ Huynh</h1>
        <div id="firebase-status" style="text-align: center; font-weight: bold; margin-bottom: 15px; color: #10B981;">📡 Đang tải hệ thống...</div>
        
        <div class="dashboard-section">
            <h3>📈 Danh sách các bé</h3>
            <div id="kids-stats-container"></div>
        </div>

        <div class="dashboard-section" id="form-add-kid">
            <h3 id="form-kid-title">➕ Thêm Hồ Sơ Bé Mới</h3>
            <div class="form-group" style="display:flex; gap:15px;">
                <div style="flex:1;"><label>Tên của con:</label><input type="text" id="new-kid-name" class="form-input" placeholder="VD: Sóc, Bo..."></div>
                <div style="flex:1;"><label>Ngày sinh (DOB):</label><input type="date" id="new-kid-dob" class="form-input"></div>
            </div>
            <div class="form-group" style="display:flex; gap:15px;">
                <div style="flex:1;"><label>Mật khẩu (Số):</label><input type="number" id="new-kid-pin" class="form-input" placeholder="VD: 123"></div>
                <div style="flex:1;"><label>Lớp học:</label>
                    <select id="new-kid-level-start" class="form-input">
                        <option value="1">Lớp mầm (3t)</option><option value="6">Lớp 1 (6t)</option><option value="16">Lớp 2 (7t+)</option>
                    </select>
                </div>
            </div>
            <button class="btn-action" id="btn-save-kid" style="width:100%;" onclick="saveKid()">Lưu Hồ Sơ</button>
            <button class="btn-action hidden" id="btn-cancel-edit" style="width:100%; margin-top:15px; background:#94A3B8; box-shadow: 0 6px 0 #64748B;" onclick="cancelEdit()">Hủy Chỉnh Sửa</button>
        </div>

        <div class="dashboard-section">
            <h3>🔒 Đổi Mật Khẩu Phụ Huynh (Số)</h3>
            <div class="form-group"><input type="number" id="new-parent-pass" class="form-input" placeholder="Nhập mật khẩu mới..."></div>
            <button class="btn-action" style="width:100%; background:#8B5CF6; box-shadow: 0 6px 0 #6D28D9;" onclick="changeParentPass()">Cập Nhật Pass</button>
            <p style="font-size: 13px; margin-top:10px; color:#64748B; font-weight: bold;">*Mật khẩu mặc định/khôi phục là: 1234.</p>
        </div>
    </div>

    <div id="screen-game" class="screen hidden">
        <div class="game-top-panel">
            <div class="kid-info-header">
                <div id="game-kid-avatar"></div>
                <div style="display: flex; flex-direction: column;">
                    <span style="font-weight:900; font-size:20px; color:var(--text-main);"><span id="game-kid-name"></span> (<span id="game-kid-age-text"></span>t)</span>
                    <span id="game-kid-dob-text" style="font-size:12px; color:#64748B; font-weight:bold;">Sinh: --/--/----</span>
                    <span id="display-time" style="font-size:12px; color:#0284C7; font-weight:900;">⏱ Hôm nay: 0 phút</span>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
                <div class="level-tag" id="display-level">LEVEL 1</div>
                <div class="kid-diamond-tag" id="game-diamond-count" style="font-size: 14px;">💎 0</div>
            </div>
        </div>

        <div class="game-bottom-panel">
            <button class="btn-back" type="button" onclick="exitGame()">⬅ Ra Ngoài Chơi</button>
            <div class="question-display" id="display-question">Đang chuẩn bị câu hỏi...</div>
            <div id="answers-container" class="answers-grid"></div>
            <div id="display-feedback" style="height: 35px; margin-top: 15px; font-size: 22px; font-weight: 900; text-align: center;"></div>
        </div>
    </div>

    <div id="modal-auth" class="modal-overlay hidden">
        <div class="modal-content">
            <button class="btn-modal-exit" onclick="hideAuthModal()">⬅ Trở lại</button>
            <h3 id="auth-title" style="margin-bottom: 5px; color: var(--primary-hover); font-size: 22px; font-weight: 900; margin-top: 10px;">Nhập Mật Khẩu</h3>
            <div class="pin-display-box" id="auth-input-display"></div>
            <div class="virtual-keypad">
                <button class="key-btn" onclick="pressKey('1')">1</button><button class="key-btn" onclick="pressKey('2')">2</button><button class="key-btn" onclick="pressKey('3')">3</button>
                <button class="key-btn" onclick="pressKey('4')">4</button><button class="key-btn" onclick="pressKey('5')">5</button><button class="key-btn" onclick="pressKey('6')">6</button>
                <button class="key-btn" onclick="pressKey('7')">7</button><button class="key-btn" onclick="pressKey('8')">8</button><button class="key-btn" onclick="pressKey('9')">9</button>
                <button class="key-btn key-btn-red" onclick="pressKey('clear')">Xóa</button><button class="key-btn" onclick="pressKey('0')">0</button><button class="key-btn key-btn-green" onclick="verifyAuth()">VÀO</button>
            </div>
            <div id="auth-error" style="color: #EF4444; margin-top: 10px; font-size: 16px; font-weight: 900;"></div>
        </div>
    </div>

    <div id="modal-evaluation" class="modal-overlay hidden">
        <div class="modal-content" style="border-color: #10B981; box-shadow: 0 15px 0 #059669;">
            <button class="btn-modal-exit" onclick="hideEvaluationModal()">⬅ Đóng</button>
            <div id="evaluation-content" style="margin-top: 20px;"></div>
        </div>
    </div>

    <div id="toast-msg" class="toast">✅ Đã lưu thành công!</div>

    <script>
        // =========================================================================
        // [CẤU HÌNH FIREBASE CLOUD] - Tích hợp lưu trữ online đồng bộ cực nhanh
        // =========================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCfnrv1oTx9YXdfDHux3lSA41ZCFBtzLf0",
            authDomain: "web-game-be-ngoan.firebaseapp.com",
            databaseURL: "https://web-game-be-ngoan-default-rtdb.firebaseio.com",
            projectId: "web-game-be-ngoan",
            storageBucket: "web-game-be-ngoan.firebasestorage.app",
            messagingSenderId: "208038386340",
            appId: "1:208038386340:web:806e9e7304439217aa6431",
            measurementId: "G-C4WW349XHK"
        };
        
        let dbRef = null;
        let isFirebaseConnected = false;

        try {
            if (firebaseConfig.apiKey) {
                firebase.initializeApp(firebaseConfig);
                dbRef = firebase.database().ref('brainGameData_Cloud');
                isFirebaseConnected = true;
            }
        } catch (e) {
            console.log("Không thể kết nối Firebase. Đang chạy chế độ Local.");
        }

        // --- 1. HỖ TRỢ NGÀY THÁNG ---
        function calculateAge(dobString) {
            if(!dobString) return 0;
            const diff = Date.now() - new Date(dobString).getTime();
            return Math.abs(new Date(diff).getUTCFullYear() - 1970);
        }
        function formatDate(dobString) {
            if(!dobString) return "Chưa cập nhật";
            let d = new Date(dobString);
            return `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()}`;
        }
        setInterval(() => {
            let now = new Date();
            document.getElementById('clock-display').innerText = `${now.toLocaleDateString('vi-VN')} - ${now.toLocaleTimeString('vi-VN')}`;
        }, 1000);

        // --- 2. ÂM THANH ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            if(type === 'correct') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // --- 3. DỮ LIỆU & BIẾN TOÀN CẦU ---
        let appData = { parentPass: "1234", theme: "default", lastUpdated: 0, kids: [] };

        // ==========================================
        // KHỞI TẠO ĐỒNG BỘ: TRÁNH LỖI TIMESTAMP MỚI TẠO ĐÈ LÊN CLOUD
        // ==========================================
        function initApp() {
            let isLoaded = false;
            const localRaw = localStorage.getItem('brainGameData_v20'); // Đổi key v20 làm sạch lỗi cũ
            let localData = localRaw ? JSON.parse(localRaw) : null;

            if (isFirebaseConnected) {
                document.getElementById('firebase-status').innerText = "📡 Đang lấy dữ liệu máy chủ Cloud...";
                
                // Fallback nếu mạng yếu
                setTimeout(() => {
                    if (!isLoaded) {
                        isLoaded = true;
                        loadFallback(localData, "⚠️ Mạng yếu. Đang dùng dữ liệu trên máy.");
                    }
                }, 3500);

                dbRef.on('value', (snapshot) => {
                    if (isLoaded) return;
                    isLoaded = true;
                    
                    const cloudData = snapshot.val();
                    
                    if (cloudData && cloudData.kids) {
                        // So sánh dữ liệu Cloud với dữ liệu Local
                        // Ưu tiên dữ liệu Cloud nếu Local chưa có gì, HOẶC Cloud có Timestamp mới hơn
                        if (!localData || (cloudData.lastUpdated || 0) > (localData.lastUpdated || 0) || localData.kids.length === 0) {
                            appData = cloudData;
                            ensureDataStructure();
                            localStorage.setItem('brainGameData_v20', JSON.stringify(appData));
                            
                            changeTheme(appData.theme || 'default');
                            renderKidsMenu();
                            if(!document.getElementById('screen-parent').classList.contains('hidden')) renderParentDashboard();
                            if(!document.getElementById('screen-game').classList.contains('hidden')) updateGameHeader();
                            document.getElementById('firebase-status').innerText = "⚡ Đã cập nhật tức thì từ Cloud!";
                        } else if ((cloudData.lastUpdated || 0) < (localData.lastUpdated || 0)) {
                            // Local mới hơn -> Cập nhật lên Cloud
                            appData = localData;
                            dbRef.set(appData);
                            document.getElementById('firebase-status').innerText = "✅ Đã đồng bộ từ Máy lên Cloud";
                            changeTheme(appData.theme || 'default');
                            renderKidsMenu();
                        } else {
                            appData = cloudData;
                            document.getElementById('firebase-status').innerText = "✅ Dữ liệu Cloud đồng bộ an toàn";
                            changeTheme(appData.theme || 'default');
                            renderKidsMenu();
                        }
                    } else {
                        // Firebase trống trơn
                        if (localData && localData.kids && localData.kids.length > 0) {
                            appData = localData;
                        } else {
                            createDefaultProfiles();
                        }
                        dbRef.set(appData);
                        document.getElementById('firebase-status').innerText = "✅ Khởi tạo dữ liệu Cloud thành công";
                        changeTheme(appData.theme || 'default');
                        renderKidsMenu();
                    }
                });
            } else {
                loadFallback(localData, "💾 Đang dùng bộ nhớ máy (Offline)");
            }
        }

        function loadFallback(localData, msg) {
            document.getElementById('firebase-status').innerText = msg;
            if (localData && localData.kids && localData.kids.length > 0) { 
                appData = localData; 
                ensureDataStructure();
            } else { 
                createDefaultProfiles(); 
            }
            changeTheme(appData.theme || 'default');
            renderKidsMenu();
        }

        function triggerAvatarUpload(event, index) { event.stopPropagation(); uploadTargetIndex = index; document.getElementById('global-avatar-upload').click(); }
        function handleGlobalAvatarUpload(event) {
            let file = event.target.files[0]; if(!file || uploadTargetIndex === -1) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas'); const MAX = 200; let w = img.width; let h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    canvas.width = w; canvas.height = h; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
                    appData.kids[uploadTargetIndex].avatarType = 'image'; appData.kids[uploadTargetIndex].avatarData = canvas.toDataURL('image/jpeg', 0.8);
                    try { saveData(); renderKidsMenu(); showToast("📸 Đã cập nhật ảnh đẹp!"); } catch(err) { alert("⚠️ Lỗi bộ nhớ! Vui lòng dùng ảnh khác nhẹ hơn."); }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file); event.target.value = ''; 
        }

        function getRandomArr(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function shuffleSlice(arr, count) { return [...arr].sort(() => 0.5 - Math.random()).slice(0, count); }

        function generateKidFriendlyQuestion(kid, level) {
            let q = { html: '', answer: null, options: [] };
            let ava = kid.avatarType === 'image' ? `<img src="${kid.avatarData}" class="inline-avatar" style="border-radius:50%; object-fit:cover; border:2px solid var(--primary);">` : `<span class="inline-avatar" style="font-size:1.5em;">${kid.avatarData}</span>`; 

            if (level <= 5) {
                let rType = Math.random();
                if (rType < 0.5) {
                    let ans = Math.floor(Math.random() * (level + 2)) + 1; 
                    let item = getRandomArr(D_ITEMS);
                    q.html = `<div class="story-text">${ava} đếm xem có mấy ${item.n} nhé?</div><div class="visual-target" style="font-size: ${ans>5?'2em':'2.5em'};">${item.e.repeat(ans)}</div>`;
                    q.answer = ans;
                    let opts = new Set([ans]);
                    while(opts.size < 4) { opts.add(Math.floor(Math.random() * 12) + 1); }
                    q.options = Array.from(opts).sort(() => Math.random() - 0.5);
                } else {
                    let cItem = getRandomArr(D_ITEMS);
                    q.html = `<div class="story-text">${ava} ơi, đâu là ${cItem.n}?</div><div class="visual-target" style="font-size: 3em; color:var(--primary-hover);">❓</div>`;
                    q.answer = cItem.e;
                    let wItems = shuffleSlice(D_ITEMS.filter(i => i.e !== cItem.e), 3);
                    q.options = [cItem.e, ...wItems.map(i=>i.e)].sort(() => Math.random() - 0.5); 
                }
            } 
            else if (level <= 15) {
                let type = Math.random();
                if (type < 0.35) {
                    let item = getRandomArr(D_ITEMS);
                    let maxNum = level + 2;
                    let n1 = Math.floor(Math.random() * maxNum) + 2;
                    let n2 = Math.floor(Math.random() * maxNum) + 1;
                    q.html = `<div class="story-text">Phép tính cho ${ava} đây:</div><div class="emoji-big" style="font-size:35px; letter-spacing: 2px;">${item.e.repeat(n1)} + ${item.e.repeat(n2)} = ?</div>`;
                    q.answer = n1 + n2;
                    let opts = new Set([q.answer]);
                    while(opts.size < 4) { let fake = q.answer + (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1); if(fake>=0) opts.add(fake); }
                    q.options = Array.from(opts).sort(() => Math.random() - 0.5);
                } else if (type < 0.7) {
                    let pType = Math.floor(Math.random() * 3);
                    let i1 = getRandomArr(D_ITEMS).e; let i2 = getRandomArr(D_ITEMS.filter(i=>i.e!==i1)).e; let i3 = getRandomArr(D_ITEMS.filter(i=>i.e!==i1 && i.e!==i2)).e;
                    if (pType === 0) {
                        q.html = `<div class="story-text">${ava} tìm hình tiếp theo nhé:</div><div class="emoji-big">${i1} ${i2} ${i1} ${i2} <b>❓</b></div>`; q.answer = i1;
                    } else if (pType === 1) {
                        q.html = `<div class="story-text">Quy luật cho ${ava} đây:</div><div class="emoji-big">${i1} ${i1} ${i2} ${i1} ${i1} <b>❓</b></div>`; q.answer = i2;
                    } else {
                        q.html = `<div class="story-text">${ava} đoán xem hình nào tiếp theo?</div><div class="emoji-big">${i1} ${i2} ${i3} ${i1} ${i2} <b>❓</b></div>`; q.answer = i3;
                    }
                    let wOpts = shuffleSlice(D_ITEMS.filter(i=>i.e!==q.answer), 3);
                    q.options = [q.answer, ...wOpts.map(i=>i.e)].sort(() => Math.random() - 0.5);
                    return q;
                } else {
                    let sel = getRandomArr(K_LOGIC_3.concat(K_LOGIC));
                    q.html = `<div class="story-text">Câu đố tư duy:</div><div style="font-size:1.2em;">${sel.q}</div>`;
                    q.answer = sel.a; q.options = [sel.a, ...shuffleSlice(sel.f, 3)].sort(() => Math.random() - 0.5); return q;
                }
            } 
            else {
                let isMul = level > 18 && Math.random() > 0.6;
                if (isMul) {
                    let maxM = Math.min(12, Math.floor(level / 2));
                    let m1 = Math.floor(Math.random() * maxM) + 2; let m2 = Math.floor(Math.random() * maxM) + 2; q.answer = m1 * m2;
                    q.html = `<div class="story-text">Thử thách nhân cho siêu trí tuệ ${ava}:</div><div style="font-size: 2.5em; margin-top:15px; color: var(--primary-hover);"><b>${m1} × ${m2} = ?</b></div>`;
                } else {
                    let maxNum = Math.min(2000, level * 20);
                    let num1 = Math.floor(Math.random() * maxNum) + 10; let num2 = Math.floor(Math.random() * maxNum) + 5;
                    let isMinus = Math.random() > 0.5;
                    if(isMinus) { num1 = Math.max(num1, num2 + 5); q.answer = num1 - num2; } else { q.answer = num1 + num2; }
                    q.html = `<div class="story-text">Thử thách số lớn cho ${ava}:</div><div style="font-size: 2.5em; margin-top:15px; color: var(--primary-hover);"><b>${num1} ${isMinus?"-":"+"} ${num2} = ?</b></div>`;
                }
                
                let opts = new Set([q.answer]);
                while(opts.size < 4) {
                    let offset = (Math.floor(Math.random() * 10) + 1) * (Math.random() > 0.5 ? 1 : -1);
                    if (Math.random() > 0.7 && q.answer > 10) offset = 10; 
                    if (Math.random() > 0.7 && q.answer > 10) offset = -10;
                    let fake = q.answer + offset;
                    if(fake>=0 && fake !== q.answer) opts.add(fake);
                }
                q.options = Array.from(opts).sort(() => Math.random() - 0.5);
            }
            return q;
        }

        function loadNextQuestion() {
            clearTimeout(questionTimeout); let kid = appData.kids[currentKidIndex];
            const q = generateKidFriendlyQuestion(kid, kid.level); currentCorrectAnswer = q.answer; questionStartTime = Date.now(); 
            document.getElementById('display-level').innerText = `LEVEL ${kid.level}`; document.getElementById('display-question').innerHTML = q.html; document.getElementById('display-feedback').innerText = '';
            const container = document.getElementById('answers-container'); container.innerHTML = '';
            q.options.forEach(opt => { const btn = document.createElement('button'); btn.className = 'btn-answer'; btn.innerText = opt; btn.onclick = () => checkAnswer(opt); container.appendChild(btn); });
        }

        function showFloatingReward(text, color) {
            const el = document.createElement('div'); el.innerText = text; el.style.position = 'fixed'; el.style.left = '50%'; el.style.top = '40%'; el.style.transform = 'translate(-50%, -50%)'; el.style.color = color; el.style.fontSize = '60px'; el.style.fontWeight = '900'; el.style.zIndex = '9999'; el.style.textShadow = '4px 4px 0px white, -2px -2px 0px white, 2px -2px 0px white, -2px 2px 0px white'; el.style.animation = 'floatReward 1.5s forwards'; document.body.appendChild(el); setTimeout(() => el.remove(), 1500);
        }

        function checkAnswer(selectedVal) {
            let kid = appData.kids[currentKidIndex]; const feedback = document.getElementById('display-feedback'); document.getElementById('answers-container').innerHTML = ''; 
            let timeTaken = (Date.now() - questionStartTime) / 1000;

            if(kid.totalCorrect === undefined) kid.totalCorrect = 0; if(kid.totalWrong === undefined) kid.totalWrong = 0; if(kid.fastAnswers === undefined) kid.fastAnswers = 0;

            if (selectedVal === currentCorrectAnswer) {
                playSound('correct'); kid.correctStreak++; kid.wrongStreak = 0; kid.totalCorrect++; if(timeTaken < 5) kid.fastAnswers++;
                let reward = 10; let praiseText = `🎉 Đúng rồi! +10 💎`;
                if(timeTaken < 5) { reward = 50; praiseText = `⚡ Siêu tốc độ! +50 💎`; } else if (timeTaken < 10) { reward = 30; praiseText = `🔥 Quá xuất sắc! +30 💎`; }
                kid.diamonds += reward; showFloatingReward(`+${reward} 💎`, '#10B981'); feedback.style.color = '#16A34A'; feedback.innerText = praiseText;

                if (kid.correctStreak >= 3) { kid.level++; kid.correctStreak = 0; kid.diamonds += 100; if (typeof confetti === 'function') confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 } }); feedback.innerText = `🚀 LÊN LEVEL ${kid.level} (Thưởng 100 💎)!`; }
                saveData(); updateGameHeader(); questionTimeout = setTimeout(loadNextQuestion, 2000);
            } else {
                playSound('wrong'); kid.wrongStreak++; kid.correctStreak = 0; kid.totalWrong++;
                kid.diamonds = Math.max(0, kid.diamonds - 10); showFloatingReward(`-10 💎`, '#EF4444'); feedback.style.color = '#DC2626'; feedback.innerText = `😭 Ôi sai rồi, thử lại nha!`;
                if (kid.wrongStreak >= 2 && kid.level > 1) { kid.level--; kid.wrongStreak = 0; feedback.innerText += ` (Đổi câu dễ hơn cho con 🔄)`; }
                saveData(); updateGameHeader(); questionTimeout = setTimeout(loadNextQuestion, 2500);
            }
        }

        window.onload = initApp;
    </script>
</body>
